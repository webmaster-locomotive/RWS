  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x);display:flex;justify-content:space-between;align-items:center;gap:24px\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:12px;color:#fff\"><span style=\"width:22px;height:22px;background:#EEFF3C;clip-path:polygon(0 0,60% 0,60% 40%,100% 40%,100% 100%,0 100%)\"><\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-weight:600;font-size:16px;letter-spacing:0.14em;text-transform:uppercase\">Locomotive Digital<\u002Fspan><\u002Fa>\n    <nav style=\"display:flex;flex-wrap:wrap;gap:4px;font-size:13px;letter-spacing:0.1em;text-transform:uppercase\">\n      <a href=\"#client\" style=\"color:#A6A6A6;padding:8px 14px;border-radius:40px\" style-hover=\"color:#000;background:#EEFF3C\">Клієнт<\u002Fa>\n      <a href=\"#position\" style=\"color:#A6A6A6;padding:8px 14px;border-radius:40px\" style-hover=\"color:#000;background:#EEFF3C\">Позиціонування<\u002Fa>\n      <a href=\"#content\" style=\"color:#A6A6A6;padding:8px 14px;border-radius:40px\" style-hover=\"color:#000;background:#EEFF3C\">Контент<\u002Fa>\n      <a href=\"#cases\" style=\"color:#A6A6A6;padding:8px 14px;border-radius:40px\" style-hover=\"color:#000;background:#EEFF3C\">Кейси<\u002Fa>\n      <a href=\"#price\" style=\"color:#A6A6A6;padding:8px 14px;border-radius:40px\" style-hover=\"color:#000;background:#EEFF3C\">Вартість<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"position:relative;min-height:calc(100vh - 62px);display:flex;flex-direction:column;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px);background-size:96px 96px\">\n  {{ orb }}\n  <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(0,0,0,0) 0%,rgba(0,0,0,0.85) 75%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;flex:1;max-width:1440px;width:100%;margin:0 auto;padding:clamp(48px,8vh,96px) clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;align-items:center;gap:56px\">\n    <div data-reveal=\"1\" style=\"flex:999 1 560px;display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid rgba(238,255,60,0.5);border-radius:40px;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#EEFF3C\">{{ dot }}Персональна пропозиція<\u002Fspan>\n        <span style=\"font-family:Tektur,sans-serif;font-size:15px;color:#A6A6A6;letter-spacing:0.06em\">RWS Window Service<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(42px,6.4vw,100px);line-height:1;letter-spacing:-0.015em;text-wrap:balance\"><span>Сервіс вікон, роботу якого можна побачити <\u002Fspan><span style=\"color:#EEFF3C\">до виклику майстра<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;max-width:760px;font-size:clamp(17px,1.6vw,22px);line-height:1.55;color:#A6A6A6;text-wrap:pretty\">Пропонуємо показувати в Instagram реальні ситуації клієнтів, роботу фахівців RWS та результат. Так сторінка допомагатиме людині зрозуміти, з якою проблемою можна звернутися і чого очікувати після заявки.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:28px;margin-top:8px\">\n        <a href=\"#client\" style=\"display:inline-flex;align-items:center;gap:14px;padding:22px 40px;background:#EEFF3C;color:#000;font-weight:700;font-size:15px;letter-spacing:0.08em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);transition:background .25s\" style-hover=\"background:#fff;color:#000\"><span>Переглянути стратегію<\u002Fspan><span>↓<\u002Fspan><\u002Fa>\n        <span style=\"font-family:Tektur,sans-serif;font-size:15px;color:#8C8C8C\">Locomotive Digital × RWS Window Service<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" data-delay=\"200\" style=\"flex:1 1 340px;max-width:440px;margin-left:auto\">\n      <div style=\"position:relative;padding:36px;background:linear-gradient(160deg,rgba(40,44,0,0.9) 0%,rgba(14,14,14,0.92) 60%);border:1px solid rgba(255,255,255,0.1);clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,0 100%);display:flex;flex-direction:column;gap:24px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.18)\">\n          <span style=\"font-family:Tektur,sans-serif;font-size:18px;letter-spacing:0.04em\">@rws_window.service<\u002Fspan>\n          <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#A6A6A6\">Instagram<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;color:#A6A6A6;letter-spacing:0.08em;text-transform:uppercase\">Шлях у контенті<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:8px;height:8px;background:#EEFF3C\"><\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Проблема клієнта<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:8px;height:8px;background:#EEFF3C\"><\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Діагностика<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:8px;height:8px;background:#EEFF3C\"><\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Робота майстра<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:8px;height:8px;background:#EEFF3C\"><\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Результат<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:2px;background:linear-gradient(90deg,#EEFF3C,rgba(238,255,60,0))\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;background:#EEFF3C;color:#000;overflow:hidden;padding:18px 0\">{{ marquee }}<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"client\" style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;gap:48px\">\n  <div style=\"flex:1 1 220px;align-self:flex-start;position:sticky;top:110px;display:flex;flex-direction:column;gap:14px\">\n    <span style=\"font-family:Tektur,sans-serif;font-size:clamp(56px,6vw,88px);line-height:1;color:transparent;-webkit-text-stroke:1px #EEFF3C\">01<\u002Fspan>\n    <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#A6A6A6\">Шлях клієнта<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:999 1 620px;display:flex;flex-direction:column;gap:56px\">\n    <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n      <h2 style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(40px,6vw,92px);line-height:1\">Як клієнт обирає віконний сервіс<\u002Fh2>\n      <p style=\"margin:0;max-width:820px;font-size:clamp(18px,1.7vw,24px);line-height:1.5;color:#D9D9D9;text-wrap:pretty\">Людина часто приходить із симптомом, а не з готовим технічним завданням. Вона не завжди знає, що саме потрібно ремонтувати.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:10px;font-size:16px\">\n      <span style=\"padding:12px 22px;border:1px solid rgba(255,255,255,0.35);border-radius:40px\">«Вікно продуває»<\u002Fspan>\n      <span style=\"padding:12px 22px;border:1px solid rgba(255,255,255,0.35);border-radius:40px\">«Стулка погано закривається»<\u002Fspan>\n      <span style=\"padding:12px 22px;border:1px solid rgba(255,255,255,0.35);border-radius:40px\">«Зламалася ручка»<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #262626\">\n      <span data-reveal=\"1\" style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#8C8C8C;padding:24px 0\">Перед зверненням їй важливо з’ясувати<\u002Fspan>\n      <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:12px 40px;align-items:baseline;padding:32px 0;border-top:1px solid #262626\">\n        <span style=\"font-family:Tektur,sans-serif;font-size:16px;color:#EEFF3C;min-width:40px\">01<\u002Fspan>\n        <span style=\"flex:1 1 300px;font-family:Tektur,sans-serif;font-size:clamp(26px,2.8vw,40px);line-height:1.1\">Чи працює RWS у моєму місті<\u002Fspan>\n        <span style=\"flex:1 1 300px;font-size:17px;line-height:1.55;color:#A6A6A6\">Географія роботи має бути видно одразу — у профілі, контенті й рекламі.<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:12px 40px;align-items:baseline;padding:32px 0;border-top:1px solid #262626\">\n        <span style=\"font-family:Tektur,sans-serif;font-size:16px;color:#EEFF3C;min-width:40px\">02<\u002Fspan>\n        <span style=\"flex:1 1 300px;font-family:Tektur,sans-serif;font-size:clamp(26px,2.8vw,40px);line-height:1.1\">Чи займаються моєю проблемою<\u002Fspan>\n        <span style=\"flex:1 1 300px;font-size:17px;line-height:1.55;color:#A6A6A6\">Людина впізнає свою ситуацію в реальних прикладах і розуміє, що з нею можна звернутися.<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:12px 40px;align-items:baseline;padding:32px 0;border-top:1px solid #262626;border-bottom:1px solid #262626\">\n        <span style=\"font-family:Tektur,sans-serif;font-size:16px;color:#EEFF3C;min-width:40px\">03<\u002Fspan>\n        <span style=\"flex:1 1 300px;font-family:Tektur,sans-serif;font-size:clamp(26px,2.8vw,40px);line-height:1.1\">Як відбувається виклик майстра<\u002Fspan>\n        <span style=\"flex:1 1 300px;font-size:17px;line-height:1.55;color:#A6A6A6\">Порядок запису, строки й формування вартості — зрозуміло й без зайвих запитань.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"1\" style=\"margin:0;max-width:760px;font-size:17px;line-height:1.6;color:#8C8C8C\">Сторінка має давати ці відповіді швидко й зрозуміло.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#0A0A0A;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a\">\n  <div style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;gap:48px\">\n    <div style=\"flex:1 1 220px;align-self:flex-start;position:sticky;top:110px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:Tektur,sans-serif;font-size:clamp(56px,6vw,88px);line-height:1;color:transparent;-webkit-text-stroke:1px #EEFF3C\">02<\u002Fspan>\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#A6A6A6\">Ринок<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:999 1 620px;display:flex;flex-direction:column;gap:56px\">\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n        <h2 style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Що бачимо на ринку<\u002Fh2>\n        <p style=\"margin:0;max-width:780px;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#A6A6A6\">У ніші ремонту вікон компанії зазвичай перелічують послуги, показують ціни та пропонують викликати майстра. Покупець легко знаходить кілька таких пропозицій для порівняння.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:16px\">\n        <div style=\"flex:1 1 280px;padding:36px;background:#131313;border:1px solid #222;display:flex;flex-direction:column;gap:22px\">\n          <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8C8C8C;font-weight:600\">Типова пропозиція<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;font-family:Tektur,sans-serif;font-size:clamp(20px,1.8vw,24px);color:#8C8C8C\">\n            <span style=\"padding:14px 0;border-top:1px solid #262626\">Перелік послуг<\u002Fspan>\n            <span style=\"padding:14px 0;border-top:1px solid #262626\">Ціни<\u002Fspan>\n            <span style=\"padding:14px 0;border-top:1px solid #262626;border-bottom:1px solid #262626\">«Викликати майстра»<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1.4 1 340px;padding:36px;background:linear-gradient(150deg,#2c3200 0%,#131313 60%);border:1px solid rgba(238,255,60,0.35);display:flex;flex-direction:column;gap:22px\">\n          <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C;font-weight:600\">Можливість для RWS<\u002Fspan>\n          <span style=\"font-family:Tektur,sans-serif;font-size:clamp(26px,2.6vw,38px);line-height:1.1\">Наочне пояснення роботи<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <span style=\"display:flex;gap:14px;font-size:17px;line-height:1.5\"><span style=\"color:#EEFF3C;font-weight:700\">✓<\u002Fspan><span>що майстер перевіряє<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:17px;line-height:1.5\"><span style=\"color:#EEFF3C;font-weight:700\">✓<\u002Fspan><span>як знаходить причину<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:17px;line-height:1.5\"><span style=\"color:#EEFF3C;font-weight:700\">✓<\u002Fspan><span>чому пропонує конкретне рішення<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"1\" style=\"margin:0;max-width:760px;font-size:17px;line-height:1.6;color:#D9D9D9\">Це дає клієнту більше підстав довіряти компанії ще до розмови з менеджером.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"position\" style=\"position:relative;overflow:hidden\">\n  <div style=\"position:absolute;right:-300px;top:-200px;width:900px;height:900px;background:radial-gradient(circle,rgba(210,230,20,0.22) 0%,rgba(0,0,0,0) 60%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:56px\">\n    <span data-reveal=\"1\" style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">03 — Позиціонування<\u002Fspan>\n    <h2 data-reveal=\"1\" style=\"margin:0;max-width:1240px;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5.4vw,84px);line-height:1.02;text-wrap:balance\"><span>RWS знаходить <\u002Fspan><span style=\"color:#EEFF3C\">причину проблеми<\u002Fspan><span> з вікном і зрозуміло пояснює, як її вирішити<\u002Fspan><\u002Fh2>\n    <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#8C8C8C\">Підтверджуємо кожною публікацією<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:16px\">\n        <span style=\"padding:12px 22px;border:1px solid rgba(255,255,255,0.35);border-radius:40px\">Перевірка<\u002Fspan><span style=\"color:#EEFF3C\">→<\u002Fspan>\n        <span style=\"padding:12px 22px;border:1px solid rgba(255,255,255,0.35);border-radius:40px\">Пояснення майстра<\u002Fspan><span style=\"color:#EEFF3C\">→<\u002Fspan>\n        <span style=\"padding:12px 22px;border:1px solid rgba(255,255,255,0.35);border-radius:40px\">Виконана робота<\u002Fspan><span style=\"color:#EEFF3C\">→<\u002Fspan>\n        <span style=\"padding:12px 22px;background:#EEFF3C;color:#000;border-radius:40px;font-weight:700\">Результат<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"1\" style=\"margin:0;max-width:760px;font-size:17px;line-height:1.6;color:#8C8C8C\">Окремо розповідаємо про порядок запису, строки й формування вартості, спираючись на реальні умови роботи компанії.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#0A0A0A;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a\">\n  <div style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;gap:48px\">\n    <div style=\"flex:1 1 220px;align-self:flex-start;position:sticky;top:110px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:Tektur,sans-serif;font-size:clamp(56px,6vw,88px);line-height:1;color:transparent;-webkit-text-stroke:1px #EEFF3C\">04<\u002Fspan>\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#A6A6A6\">Аудиторія<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:999 1 620px;display:flex;flex-direction:column;gap:56px\">\n      <h2 data-reveal=\"1\" style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Для кого створюємо контент<\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n        <div data-reveal=\"1\" style=\"flex:1 1 300px;display:flex\">\n          <div style=\"flex:1;padding:36px;background:#131313;border:1px solid #222;display:flex;flex-direction:column;gap:22px;transition:border-color .3s,transform .3s\" style-hover=\"border-color:#EEFF3C;transform:translateY(-6px)\">\n            <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C;font-weight:600\">Приватні клієнти<\u002Fspan>\n            <span style=\"font-family:Tektur,sans-serif;font-size:clamp(24px,2.2vw,32px);line-height:1.15\">Власники квартир і будинків<\u002Fspan>\n            <span style=\"margin-top:auto;font-size:16px;line-height:1.55;color:#A6A6A6\">Їх цікавлять протяги, несправності, стан вікон перед холодним сезоном, ремонт і захисні рішення.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" data-delay=\"120\" style=\"flex:1 1 300px;display:flex\">\n          <div style=\"flex:1;padding:36px;background:#131313;border:1px solid #222;display:flex;flex-direction:column;gap:22px;transition:border-color .3s,transform .3s\" style-hover=\"border-color:#EEFF3C;transform:translateY(-6px)\">\n            <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C;font-weight:600\">B2B<\u002Fspan>\n            <span style=\"font-family:Tektur,sans-serif;font-size:clamp(24px,2.2vw,32px);line-height:1.15\">Бізнеси та керівники приміщень<\u002Fspan>\n            <span style=\"margin-top:auto;font-size:16px;line-height:1.55;color:#A6A6A6\">Для них важливо, щоб вікна й двері працювали справно, а роботи можна було узгодити за обсягом і часом.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;padding:28px 32px;background:#EEFF3C;color:#000;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%)\">\n        <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700\">Географія<\u002Fspan>\n        <div style=\"flex:1 1 400px;display:flex;flex-wrap:wrap;gap:8px 28px;font-family:Tektur,sans-serif;font-size:clamp(20px,2vw,28px)\"><span>Львів<\u002Fspan><span>Тернопіль<\u002Fspan><span>Чернівці<\u002Fspan><span>Івано-Франківськ<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"1\" style=\"margin:0;max-width:760px;font-size:17px;line-height:1.6;color:#8C8C8C\">У контенті й рекламі чітко показуємо географію роботи, щоб людина одразу розуміла, чи може замовити послугу.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"content\" style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:56px\">\n  <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">05 — Контент<\u002Fspan>\n      <h2 style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Від запитання клієнта до рішення<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:460px;font-size:17px;line-height:1.55;color:#A6A6A6\">Теми відповідають на питання, з якими люди вже приходять до сервісу, і допомагають визначитися зі зверненням.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px\">\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"aspect-ratio:4/5;padding:24px;background:radial-gradient(circle at 80% 15%,rgba(238,255,60,0.35),rgba(0,0,0,0) 55%),#151515;border:1px solid #262626;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s\" style-hover=\"transform:translateY(-8px)\">\n          <span style=\"align-self:flex-start;padding:6px 12px;background:#EEFF3C;color:#000;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase\">Відео<\u002Fspan>\n          <span style=\"font-family:Tektur,sans-serif;font-size:clamp(22px,2vw,28px);line-height:1.1\">З вікна дме. Чи завжди потрібно міняти ущільнювач?<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:15px;line-height:1.55;color:#A6A6A6\">Майстер показує, що перевіряє перед висновком.<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-delay=\"100\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"aspect-ratio:4/5;padding:24px;background:radial-gradient(circle at 20% 90%,rgba(238,255,60,0.3),rgba(0,0,0,0) 55%),#151515;border:1px solid #262626;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s\" style-hover=\"transform:translateY(-8px)\">\n          <span style=\"align-self:flex-start;padding:6px 12px;background:#EEFF3C;color:#000;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase\">Діагностика<\u002Fspan>\n          <span style=\"font-family:Tektur,sans-serif;font-size:clamp(22px,2vw,28px);line-height:1.1\">Стулка зачіпає раму. Що може бути причиною?<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:15px;line-height:1.55;color:#A6A6A6\">Показуємо діагностику та виконану роботу.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px\">\n      <div data-reveal=\"1\" data-delay=\"200\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"aspect-ratio:4/5;padding:24px;background:#EEFF3C;color:#000;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s\" style-hover=\"transform:translateY(-8px)\">\n          <span style=\"align-self:flex-start;padding:6px 12px;background:#000;color:#EEFF3C;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase\">Допис<\u002Fspan>\n          <span style=\"font-family:Tektur,sans-serif;font-size:clamp(22px,2vw,28px);line-height:1.1\">Від чого залежить ціна ремонту?<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:15px;line-height:1.55;color:#A6A6A6\">Пояснюємо, які деталі потрібно знати для оцінки.<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-delay=\"300\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"aspect-ratio:4/5;padding:24px;background:radial-gradient(circle at 50% 50%,rgba(238,255,60,0.28),rgba(0,0,0,0) 60%),#151515;border:1px solid #262626;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s\" style-hover=\"transform:translateY(-8px)\">\n          <span style=\"align-self:flex-start;padding:6px 12px;background:#EEFF3C;color:#000;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase\">Результат<\u002Fspan>\n          <span style=\"font-family:Tektur,sans-serif;font-size:clamp(22px,2vw,28px);line-height:1.1\">Що змінює тонування?<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:15px;line-height:1.55;color:#A6A6A6\">Демонструємо результат на реальному об’єкті й пояснюємо властивості конкретного матеріалу.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cases\" style=\"position:relative;overflow:hidden;background:#0A0A0A;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a\">\n  <div style=\"position:absolute;left:-300px;bottom:-400px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(210,230,20,0.22) 0%,rgba(0,0,0,0) 60%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:56px\">\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 64px\">\n      <div style=\"flex:1 1 480px;display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">06 — Кейси<\u002Fspan>\n        <h2 style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Реальні роботи як доказ<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"flex:1 1 320px;margin:0;font-size:17px;line-height:1.6;color:#A6A6A6\">Кейси RWS можуть стати найсильнішою частиною сторінки. Кожен відповідає на чотири питання.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:#262626;border:1px solid #262626\">\n      <button sc-camel-on-click=\"{{ pick0 }}\" style=\"all:unset;cursor:pointer;position:relative;padding:24px 28px;background:{{ bg0 }};color:{{ fg0 }};display:flex;flex-direction:column;gap:8px;transition:background .3s,color .3s\"><span style=\"font-family:Tektur,sans-serif;font-size:14px;opacity:0.7\">01<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Запит<\u002Fspan>{{ bar0 }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pick1 }}\" style=\"all:unset;cursor:pointer;position:relative;padding:24px 28px;background:{{ bg1 }};color:{{ fg1 }};display:flex;flex-direction:column;gap:8px;transition:background .3s,color .3s\"><span style=\"font-family:Tektur,sans-serif;font-size:14px;opacity:0.7\">02<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Діагностика<\u002Fspan>{{ bar1 }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pick2 }}\" style=\"all:unset;cursor:pointer;position:relative;padding:24px 28px;background:{{ bg2 }};color:{{ fg2 }};display:flex;flex-direction:column;gap:8px;transition:background .3s,color .3s\"><span style=\"font-family:Tektur,sans-serif;font-size:14px;opacity:0.7\">03<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Робота<\u002Fspan>{{ bar2 }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pick3 }}\" style=\"all:unset;cursor:pointer;position:relative;padding:24px 28px;background:{{ bg3 }};color:{{ fg3 }};display:flex;flex-direction:column;gap:8px;transition:background .3s,color .3s\"><span style=\"font-family:Tektur,sans-serif;font-size:14px;opacity:0.7\">04<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Результат<\u002Fspan>{{ bar3 }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"min-height:260px;padding:clamp(28px,4vw,56px);background:linear-gradient(135deg,#1c2000 0%,#101010 55%);border:1px solid #262626;clip-path:polygon(0 0,calc(100% - 44px) 0,100% 44px,100% 100%,0 100%)\">\n      <sc-if value=\"{{ is0 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end\"><span style=\"flex:1 1 380px;font-family:Tektur,sans-serif;font-size:clamp(30px,4vw,58px);line-height:1.05\">З чим звернувся клієнт?<\u002Fspan><span style=\"flex:1 1 300px;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#D9D9D9\">Симптом словами людини: що заважало, коли з’явилася проблема, чого вона очікувала.<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ is1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end\"><span style=\"flex:1 1 380px;font-family:Tektur,sans-serif;font-size:clamp(30px,4vw,58px);line-height:1.05\">Що виявив майстер?<\u002Fspan><span style=\"flex:1 1 300px;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#D9D9D9\">Що перевіряв на місці та яку причину знайшов — зрозумілою мовою.<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ is2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end\"><span style=\"flex:1 1 380px;font-family:Tektur,sans-serif;font-size:clamp(30px,4vw,58px);line-height:1.05\">Яку роботу виконав?<\u002Fspan><span style=\"flex:1 1 300px;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#D9D9D9\">Процес ремонту чи встановлення і пояснення, чому обрали саме це рішення.<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ is3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end\"><span style=\"flex:1 1 380px;font-family:Tektur,sans-serif;font-size:clamp(30px,4vw,58px);line-height:1.05\">Який результат можна показати?<\u002Fspan><span style=\"flex:1 1 300px;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#D9D9D9\">Вікно, що працює як слід: зачиняється, не продуває, виглядає охайно.<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:24px 64px\">\n      <div style=\"flex:1 1 360px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#8C8C8C\">Формат обираємо за тим, що найкраще показує роботу<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;font-size:15px\"><span style=\"padding:10px 20px;border:1px solid #EEFF3C;color:#EEFF3C;border-radius:40px\">Короткі відео<\u002Fspan><span style=\"padding:10px 20px;border:1px solid #EEFF3C;color:#EEFF3C;border-radius:40px\">Фото з поясненням<\u002Fspan><span style=\"padding:10px 20px;border:1px solid #EEFF3C;color:#EEFF3C;border-radius:40px\">Дописи<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"flex:1 1 320px;margin:0;font-size:15px;line-height:1.6;color:#8C8C8C;align-self:flex-end\">Для публікації матеріалів з об’єкта погоджуємо з клієнтом, що саме можна знімати й показувати.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:64px\">\n  <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">07 — Профіль і шлях до заявки<\u002Fspan>\n    <h2 style=\"margin:0;max-width:1100px;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Сторінка, яка допомагає записатися<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:center\">\n    <div data-reveal=\"1\" style=\"flex:1 1 360px;max-width:520px;padding:32px;background:#0E0E0E;border:1px solid #262626;border-radius:28px;display:flex;flex-direction:column;g ">Послуги<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:52px;height:52px;border-radius:50%;border:1.5px solid #444\"><\u002Fspan><span style=\"font-size:11px;color:#A6A6A6\">Міста<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:52px;height:52px;border-radius:50%;border:1.5px solid #444\"><\u002Fspan><span style=\"font-size:11px;color:#A6A6A6\">Роботи<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:52px;height:52px;border-radius:50%;border:1.5px solid #444\"><\u002Fspan><span style=\"font-size:11px;color:#A6A6A6\">Вартість<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:52px;height:52px;border-radius:50%;border:1.5px solid #444\"><\u002Fspan><span style=\"font-size:11px;color:#A6A6A6\">Заявка<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:#EEFF3C;letter-spacing:0.08em;text-transform:uppercase\"><span style=\"width:18px;height:18px;border-radius:50%;background:#EEFF3C;color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px\">3<\u002Fspan>Закріплені<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:4px\">\n          <div style=\"aspect-ratio:1;background:#1a1a1a;display:flex;align-items:flex-end;padding:10px;font-size:12px\">Послуги<\u002Fdiv>\n          <div style=\"aspect-ratio:1;background:#1a1a1a;display:flex;align-items:flex-end;padding:10px;font-size:12px\">Кейс<\u002Fdiv>\n          <div style=\"aspect-ratio:1;background:#EEFF3C;color:#000;display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:600\">Як викликати майстра<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 360px;display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;flex-direction:column\">\n        <span data-reveal=\"1\" style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#8C8C8C;padding-bottom:16px\">Після переходу в профіль людина швидко знаходить<\u002Fspan>\n        <div data-reveal=\"1\" style=\"display:flex;gap:20px;padding:22px 0;border-top:1px solid #262626\"><span style=\"font-family:Tektur,sans-serif;color:#EEFF3C;min-width:28px\">1<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Перелік послуг і міста роботи<\u002Fspan><\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;gap:20px;padding:22px 0;border-top:1px solid #262626\"><span style=\"font-family:Tektur,sans-serif;color:#EEFF3C;min-width:28px\">2<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Приклади виконаних робіт<\u002Fspan><\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;gap:20px;padding:22px 0;border-top:1px solid #262626\"><span style=\"font-family:Tektur,sans-serif;color:#EEFF3C;min-width:28px\">3<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Відповіді про діагностику, вартість і строки<\u002Fspan><\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;gap:20px;padding:22px 0;border-top:1px solid #262626;border-bottom:1px solid #262626\"><span style=\"font-family:Tektur,sans-serif;color:#EEFF3C;min-width:28px\">4<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:22px\">Зрозумілий спосіб залишити заявку<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"padding:28px;background:#131313;border:1px solid #262626;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C;font-weight:600\">Легко написати<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;font-size:15px\"><span style=\"padding:10px 18px;background:#1f1f1f;border-radius:18px 18px 18px 4px\">Моє місто<\u002Fspan><span style=\"padding:10px 18px;background:#1f1f1f;border-radius:18px 18px 18px 4px\">Що сталося з вікном<\u002Fspan><span style=\"padding:10px 18px;background:#EEFF3C;color:#000;border-radius:18px 18px 18px 4px;font-weight:600\">Фото / відео проблеми<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"1\" style=\"margin:0;max-width:760px;font-size:17px;line-height:1.6;color:#8C8C8C\">Переглядаємо опис профілю, закріплені публікації та Highlights як єдиний шлях до звернення.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"background:#0A0A0A;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a\">\n  <div style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;gap:48px\">\n    <div style=\"flex:1 1 220px;align-self:flex-start;position:sticky;top:110px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:Tektur,sans-serif;font-size:clamp(56px,6vw,88px);line-height:1;color:transparent;-webkit-text-stroke:1px #EEFF3C\">08<\u002Fspan>\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#A6A6A6\">SMM і реклама<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:999 1 620px;display:flex;flex-direction:column;gap:56px\">\n      <h2 data-reveal=\"1\" style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Як SMM працюватиме разом із рекламою<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;border-left:1px solid #262626\">\n        <div data-reveal=\"1\" style=\"position:relative;padding:0 0 44px 40px;display:flex;flex-direction:column;gap:12px\"><span style=\"position:absolute;left:-6px;top:6px;width:11px;height:11px;background:#EEFF3C\"><\u002Fspan><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">Контент<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:clamp(24px,2.4vw,34px)\">Дає рекламі теми й матеріали<\u002Fspan><span style=\"max-width:720px;font-size:17px;line-height:1.6;color:#A6A6A6\">Конкретні несправності, пояснення майстрів, завершені роботи.<\u002Fspan><\u002Fdiv>\n        <div data-reveal=\"1\" style=\"position:relative;padding:0 0 44px 40px;display:flex;flex-direction:column;gap:12px\"><span style=\"position:absolute;left:-6px;top:6px;width:11px;height:11px;background:#EEFF3C\"><\u002Fspan><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">Реклама<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:clamp(24px,2.4vw,34px)\">Приводить людину з відповідним запитом<\u002Fspan><\u002Fdiv>\n        <div data-reveal=\"1\" style=\"position:relative;padding:0 0 44px 40px;display:flex;flex-direction:column;gap:12px\"><span style=\"position:absolute;left:-6px;top:6px;width:11px;height:11px;background:#EEFF3C\"><\u002Fspan><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">Сторінка<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:clamp(24px,2.4vw,34px)\">Допомагає перевірити компанію та звернутися<\u002Fspan><\u002Fdiv>\n        <div data-reveal=\"1\" style=\"position:relative;padding:0 0 0 40px;display:flex;flex-direction:column;gap:12px\"><span style=\"position:absolute;left:-6px;top:6px;width:11px;height:11px;border:1.5px solid #EEFF3C;background:#000\"><\u002Fspan><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">Заявки<\u002Fspan><span style=\"font-family:Tektur,sans-serif;font-size:clamp(24px,2.4vw,34px)\">Підказують, про що говорити далі<\u002Fspan><span style=\"max-width:720px;font-size:17px;line-height:1.6;color:#A6A6A6\">Якщо люди часто запитують про одну послугу або вагаються через вартість, це стає темою наступного матеріалу.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;padding:28px 32px;background:#EEFF3C;color:#000;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%)\">\n        <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700\">Підсумок<\u002Fspan>\n        <span style=\"flex:1 1 400px;font-family:Tektur,sans-serif;font-size:clamp(19px,1.8vw,25px);line-height:1.3\">Контент спирається на реальні питання покупців<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:56px\">\n  <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 64px\">\n    <div style=\"flex:1 1 480px;display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">09 — Результат для бізнесу<\u002Fspan>\n      <h2 style=\"margin:0;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">Оцінюємо не лише охоплення<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"flex:1 1 320px;margin:0;font-size:17px;line-height:1.6;color:#A6A6A6\">SMM має допомогти RWS чіткіше представити послуги, показати якість роботи та підготувати людину до звернення.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column\">\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;padding:28px 24px;border-top:1px solid #262626;transition:background .3s,color .3s\" style-hover=\"background:#EEFF3C;color:#000\"><span style=\"font-family:Tektur,sans-serif;font-size:clamp(30px,5vw,72px);line-height:1;color:inherit\">Цільові заявки<\u002Fspan><span style=\"font-size:15px;letter-spacing:0.06em;text-transform:uppercase;color:inherit;opacity:0.7\">кількість звернень<\u002Fspan><\u002Fdiv>\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;padding:28px 24px;border-top:1px solid #262626;transition:background .3s,color .3s\" style-hover=\"background:#EEFF3C;color:#000\"><span style=\"font-family:Tektur,sans-serif;font-size:clamp(30px,5vw,72px);line-height:1;color:inherit\">Записи на виїзд<\u002Fspan><span style=\"font-size:15px;letter-spacing:0.06em;text-transform:uppercase;color:inherit;opacity:0.7\">виклики майстра<\u002Fspan><\u002Fdiv>\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;padding:28px 24px;border-top:1px solid #262626;border-bottom:1px solid #262626;transition:background .3s,color .3s\" style-hover=\"background:#EEFF3C;color:#000\"><span style=\"font-family:Tektur,sans-serif;font-size:clamp(30px,5vw,72px);line-height:1;color:inherit\">Виконані роботи<\u002Fspan><span style=\"font-size:15px;letter-spacing:0.06em;text-transform:uppercase;color:inherit;opacity:0.7\">продажі<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:24px 64px\">\n    <p style=\"flex:1 1 360px;margin:0;font-size:17px;line-height:1.6;color:#D9D9D9\">На старті визначимо пріоритетні послуги й міста, зберемо питання клієнтів та доступні кейси. Після цього сформуємо теми й узгодимо обсяг контенту відповідно до пакета.<\u002Fp>\n    <p style=\"flex:1 1 360px;margin:0;font-size:17px;line-height:1.6;color:#8C8C8C\">Числові цілі поставимо на основі даних RWS про звернення та продажі.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"price\" style=\"position:relative;overflow:hidden;background:#0A0A0A;border-top:1px solid #1a1a1a\">\n  <div style=\"position:absolute;right:-250px;top:10%;width:900px;height:900px;background:radial-gradient(circle,rgba(210,230,20,0.25) 0%,rgba(0,0,0,0) 60%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,180px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:56px\">\n    <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#EEFF3C\">10 — Пакет і вартість<\u002Fspan>\n      <h2 style=\"margin:0;max-width:1100px;font-family:Tektur,sans-serif;font-weight:500;font-size:clamp(36px,5vw,76px);line-height:1.03\">SMM-пакет<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:16px\">\n      <div data-reveal=\"1\" style=\"flex:1 1 440px;display:flex\">\n        <div style=\"flex:1;padding:clamp(28px,4vw,48px);background:#121212;border:1px solid #262626;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,0 100%);display:flex;flex-direction:column;gap:24px\">\n          <span style=\"align-self:flex-start;padding:8px 16px;border:1px solid #EEFF3C;color:#EEFF3C;border-radius:40px;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">Перший місяць<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px;background:rgba(238,255,60,0.08);border:1px solid rgba(238,255,60,0.3)\">\n            <span style=\"font-family:Tektur,sans-serif;font-size:clamp(20px,2vw,26px);color:#EEFF3C\">Розробка SMM-стратегії<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.55;color:#D9D9D9\">Аналіз бренду, аудиторії та конкурентів, визначення цілей, контентних напрямків і стилю комунікації.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#A6A6A6\">Повний місячний пакет контенту<\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>6 відео: сценарії, монтаж та публікація<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>1 зйомка<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>3 дописи (до 30 картинок): тексти, дизайн та публікація<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>25 сторіс: підготовка та публікація<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>6 обкладинок для відео<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>Контент-план<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>Аналітика та звітність<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:14px;padding-top:24px;border-top:1px solid #333\">\n            <span style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#A6A6A6\">Вартість робіт<\u002Fspan>\n            <span style=\"font-family:Tektur,sans-serif;font-size:clamp(56px,6.5vw,96px);line-height:0.9\">1350 $<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-delay=\"150\" style=\"flex:1 1 440px;display:flex\">\n        <div style=\"flex:1;padding:clamp(28px,4vw,48px);background:linear-gradient(150deg,#2c3200 0%,#121212 55%);border:1px solid rgba(238,255,60,0.35);clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,0 100%);display:flex;flex-direction:column;gap:24px\">\n          <span style=\"align-self:flex-start;padding:8px 16px;border:1px solid #EEFF3C;background:#EEFF3C;color:#000;border-radius:40px;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">Другий та наступні місяці<\u002Fspan>\n          <span style=\"font-family:Tektur,sans-serif;font-size:clamp(22px,2.2vw,30px);line-height:1.2\">Той самий обсяг контенту за погодженою SMM-стратегією<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>6 відео, 3 дописи (до 30 картинок), 25 сторіс, 6 обкладинок<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>1 зйомка<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>Контент-план<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:14px;font-size:16px;line-height:1.5;color:#D9D9D9\"><span style=\"flex:none;width:6px;height:6px;margin-top:9px;background:#EEFF3C\"><\u002Fspan><span>Аналітика та звітність<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:22px;border:1px dashed rgba(238,255,60,0.45);display:flex;gap:14px;font-size:16px;line-height:1.55;color:#D9D9D9\"><span style=\"color:#EEFF3C;font-weight:700\">↓<\u002Fspan><span>Вартість нижча, оскільки розробка стратегії оплачується лише в перший місяць.<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:14px;padding-top:24px;border-top:1px solid #333\">\n            <span style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#A6A6A6\">Вартість робіт<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px\"><span style=\"font-family:Tektur,sans-serif;font-size:clamp(56px,6.5vw,96px);line-height:0.9;color:#EEFF3C\">1125 $<\u002Fspan><span style=\"font-size:18px;color:#A6A6A6\">/ місяць<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"position:relative;overflow:hidden;border-top:1px solid #1a1a1a\">\n  <div style=\"max-width:1440px;margin:0 auto;padding:56px clamp(20px,5vw,72px) 32px;display:flex;flex-direction:column;gap:24px\">\n    <span style=\"font-family:Tektur,sans-serif;font-weight:700;font-size:clamp(56px,14.5vw,210px);line-height:0.85;letter-spacing:-0.02em;color:transparent;-webkit-text-stroke:1px #2e2e2e;white-space:nowrap\">LOCOMOTIVE<\u002Fspan>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#8C8C8C\">\n      <span>Locomotive Digital × RWS Window Service<\u002Fspan>\n      <span>SMM-міністратегія · 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { tab: 0, auto: true };\n  componentDidMount() {\n    this.timer = setInterval(() => { if (this.state.auto) this.setState(s => ({ tab: (s.tab + 1) % 4 })); }, 6000);\n    this.setupReveal();\n  }\n  setupReveal() {\n    if (typeof IntersectionObserver === 'undefined' || !Element.prototype.animate) return;\n    const ease = 'cubic-bezier(.2,.7,.2,1)';\n    this.io = new IntersectionObserver(es => es.forEach(en => {\n      if (!en.isIntersecting) return;\n      const el = en.target; this.io.unobserve(el);\n      el.animate([{ opacity: 0, transform: 'translateY(40px)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: ease, delay: +(el.dataset.delay || 0), fill: 'backwards' });\n    }), { threshold: 0.1 });\n    document.querySelectorAll('[data-reveal]').forEach(el => this.io.observe(el));\n  }\n  componentWillUnmount() { clearInterval(this.timer); this.io && this.io.disconnect(); }\n  renderVals() {\n    const t = this.state.tab, e = React.createElement;\n    const words = ['Діагностика', 'Пояснення майстра', 'Реальні роботи', 'Результат'];\n    const v = {\n      orb: e('div', { style: { position: 'absolute', right: '-18vw', top: '-8vh', width: '75vw', height: '75vw', maxWidth: 1150, maxHeight: 1150, borderRadius: '50%', background: 'radial-gradient(circle, rgba(215,235,20,0.55) 0%, rgba(120,140,0,0.22) 38%, rgba(0,0,0,0) 66%)', animation: 'orb 14s ease-in-out infinite alternate', pointerEvents: 'none' } }),\n      dot: e('span', { style: { width: 7, height: 7, borderRadius: '50%', background: '#EEFF3C', animation: 'blink 1.6s ease-in-out infinite' } }),\n      marquee: e('div', { style: { display: 'flex', width: 'max-content', animation: 'marquee 36s linear infinite' } },\n        [0, 1].map(k => e('div', { key: k, style: { display: 'flex', alignItems: 'center', gap: 40, paddingRight: 40 } },\n          words.concat(words).flatMap((w, i) => [\n            e('span', { key: 'w' + i, style: { fontFamily: 'Tektur, sans-serif', fontSize: 'clamp(20px,2.2vw,30px)', fontWeight: 500, whiteSpace: 'nowrap', textTransform: 'uppercase', letterSpacing: '0.04em' } }, w),\n            e('span', { key: 's' + i, style: { width: 12, height: 12, background: '#000', flex: 'none' } })\n          ])))),\n    };\n    for (let i = 0; i < 4; i++) {\n      v['is' + i] = t === i;\n      v['bg' + i] = t === i ? '#EEFF3C' : '#0A0A0A';\n      v['fg' + i] = t === i ? '#000' : '#fff';\n      v['pick' + i] = () => this.setState({ tab: i, auto: false });\n      v['bar' + i] = t === i ? e('span', { key: 'b' + t + this.state.auto, style: { position: 'absolute', left: 0, bottom: 0, height: 3, width: '100%', background: '#000', transformOrigin: 'left', animation: this.state.auto ? 'grow 6s linear forwards' : 'none' } }) : null;\n    }\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
